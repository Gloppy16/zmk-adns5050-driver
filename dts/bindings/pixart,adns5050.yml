# ADNS-5050 over a 3-wire bit-banged bus (SCLK / SDIO / CS), no SPI hardware,
# no MOTION interrupt line. Polling driver for ZMK.

description: |
  Pixart ADNS-5050 optical mouse sensor, bit-banged 3-wire serial bus.

  The ADNS-5050 uses a half-duplex single-data-line serial protocol that
  hardware SPI controllers (e.g. nRF SPIM) cannot drive, so the three
  signal pins are bit-banged as plain GPIOs:

    sclk-gpios = serial clock, idles LOW
    sdio-gpios = bidirectional data line
    cs-gpios   = chip select, idles HIGH, active LOW

  Motion is polled; there is no MOTION pin on the cocot46plus trackball.

compatible: "pixart,adns5050"

properties:
  vcc-gpios:
    type: phandle-array
    required: false
    description: |
      Optional control pin for the sensor's supply rail (load-switch enable).

      The driver drives it ACTIVE at device init and re-asserts it at the
      top of EVERY init attempt, then waits ADNS5050_POWER_UP_DELAY_MS
      (once per init cycle) before the first bus transaction.

      CAUTION: on boards whose sensor rides a switched rail (nice!nano:
      the Pro Micro VCC pin is gated by an internal load switch on P0.13),
      this MUST point at the SAME GPIO the board's ext_power node controls
      - e.g. <&gpio0 13 GPIO_ACTIVE_HIGH> on nice_nano_v2 - making this a
      deliberate second owner of that pin, not a second pin. That is the
      point: ZMK consumers of the rail (underglow AUTO_OFF_IDLE calling
      ext_power_disable, or an NVS-restored ext_power off-state) can cut
      it behind this driver's back; re-asserting here guarantees the
      sensor stays powered regardless.

  sclk-gpios:
    type: phandle-array
    required: true
    description: Serial clock pin (idles low).

  sdio-gpios:
    type: phandle-array
    required: true
    description: Bidirectional serial data pin.

  cs-gpios:
    type: phandle-array
    required: true
    description: Chip select pin (active low).

  cpi:
    type: int
    default: 500
    enum:
      - 125
      - 250
      - 375
      - 500
      - 625
      - 750
      - 875
      - 1000
      - 1125
      - 1250
      - 1375
    description: |
      Counts per inch, in 125 CPI steps (register value 1..13).
      Default 500, matching QMK's cocot46plus default.

  invert-x:
    type: boolean
    description: Invert the reported X axis direction.

  invert-y:
    type: boolean
    description: Invert the reported Y axis direction.

  scroll-layers:
    type: array
    default: []
    description: |
      Layer indexes on which trackball motion is reported as wheel
      scrolling instead of cursor movement. The value is compared
      against zmk_keymap_highest_layer_active().
